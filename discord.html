<!-- casteria.fr/discord (19/10/2026, le propriétaire : « un casteria.fr/discord qui affiche et redirige vers [l'invitation],
     simple beau efficace la page et direct le bouton pas de chichi ») : le logo, le titre, une phrase et le grand bouton.
     (20/10/2026) L'invitation PERMANENTE (elle n'expire jamais, elle arrive sur le salon « jouer ») remplace celle de 30
     jours, qui expirait le 04/11. La page part toute seule au bout d'une seconde : le refresh de la tête, et le script du bas
     (location.replace : le retour arrière ne ramène pas ici). L'invitation n'est écrite qu'ici, à ces trois places (et dans
     outils/verifier.js, qui les vérifie) : pour en changer, les quatre ensemble. -->
<section class="heros vitrine-tete discord" id="haut">
  <div class="fond plein-cadre" aria-hidden="true">
    <picture>
      <source media="(max-aspect-ratio: 2/3)" type="image/webp" srcset="/assets/images/casteria-decollage-portrait-720.webp 720w" sizes="100vw">

      <img src="/assets/images/casteria-decollage-1920.jpg" alt="" width="2752" height="1536" fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="discord-texte">
    <a class="discord-logo" href="/" aria-label="Casteria, l'accueil"><img src="/assets/logo/casteria-logo-300.webp" alt="Logo de Casteria : un dragon violet sur une île" width="300" height="300"></a>
    <h1>Le <span class="or">Discord</span> de Casteria</h1>
    <p class="accroche">Les joueurs et le staff t'attendent : on t'y emmène dans un instant.</p>
    <a class="bouton bouton-or grand" href="https://discord.gg/Xp325uTFe7">Rejoindre le Discord</a>
  </div>
</section>
